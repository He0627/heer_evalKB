name: Knowledge freshness

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate freshness report
        run: |
          python scripts/validate.py --freshness-report > freshness-report.md
          cat freshness-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: freshness-report.md
