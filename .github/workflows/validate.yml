name: Validate knowledge base

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify generated files are current
        run: python scripts/build_index.py --check
      - name: Validate with strict gates
        run: python scripts/validate.py --strict
